<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SignBridge AI — Accessible Civic Communication Portal</title>
  
  <!-- Atkinson Hyperlegible Next & Material Symbols Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..24,400..700,0..1,-50..200" rel="stylesheet" />

  <!-- Tailwind CSS via CDN with customized Stitch design system theme -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#001428",
            "primary-container": "#0f2942",
            "on-primary": "#ffffff",
            "secondary": "#006a61",
            "secondary-teal": "#0d9488",
            "secondary-container": "#86f2e4",
            "on-secondary-container": "#006f66",
            "surface": "#f7f9fb",
            "surface-container-lowest": "#ffffff",
            "surface-container-low": "#f2f4f6",
            "surface-container": "#eceef0",
            "surface-container-high": "#e6e8ea",
            "surface-container-highest": "#e0e3e5",
            "on-surface": "#191c1e",
            "on-surface-variant": "#43474d",
            "outline": "#74777e",
            "outline-variant": "#c3c6ce",
            "error-container": "#ffdad6",
            "on-error-container": "#93000a",
            "error": "#ba1a1a",
            "on-error": "#ffffff"
          },
          fontFamily: {
            "body": ["Atkinson Hyperlegible Next", "sans-serif"]
          },
          animation: {
            fadeIn: 'fadeIn 0.25s ease-in-out forwards'
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0', transform: 'translateY(4px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' }
            }
          }
        }
      }
    };
  </script>

  <!-- SignBridge Design System CSS -->
  <link rel="stylesheet" href="./styles/main.css" />
</head>
<body class="bg-surface font-body text-on-surface antialiased selection:bg-primary-container selection:text-white">
  <!-- Dynamic Application Root -->
  <div id="app" class="min-h-screen w-full flex flex-col"></div>

  <!-- MediaPipe Client-Side Landmark Extraction (Non-blocking) -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/holistic/holistic.js" crossorigin="anonymous"></script>

  <!-- Main ES Module Application Script -->
  <script type="module" src="./app.js"></script>
</body>
</html>
